# Configure the QASPER retrieval benchmarks B1 to B4.
#
# Pin the dataset revision, split, chunking, candidate budgets, RRF
# parameters, seed, and values of k. Record the text-evidence criteria used
# for the denominator.

benchmark:
  dataset_name: "allenai/qasper"
  dataset_version: "0.3.0"
  split: "test"
  seed: 42

retrieval:
  sparse_candidates: 40
  dense_candidates: 40
  rrf_k: 60
  rerank_candidates: 20
  embedding_model: "intfloat/multilingual-e5-large"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  max_passage_tokens: 400
  eval_k_values: [1, 3, 5, 10]
